server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # No /api proxy: the browser reaches the backend over iroh (iroh-fetch -> relay -> iroh-gateway), so this
    # container only serves static files and can run anywhere, with no route to the backend.

    # Written at container start from the environment (docker-entrypoint.d/40-iroh-config.sh). Never cache it,
    # so a new gateway endpoint id takes effect on the next page load.
    location = /iroh.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # iroh-fetch's WebAssembly client (~3.4 MB, ~1.4 MB gzipped).
    location = /wasm/web_client_bg.wasm {
        gzip on;
        gzip_types application/wasm;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Hashed build output can be cached forever.
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback so deep links like /claim/track load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
